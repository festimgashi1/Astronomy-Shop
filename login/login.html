<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <img src="logo.png" alt="Logo">
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="/Home/index.html">Home</a></li>
                    <li><a href="/events/events.html">Events</a></li>
                    <li><a href="/news/news.html">News</a></li>
                    <li><a href="/Shop/shop.html">Shop</a></li>
                    <li><a href="/aboutus/aboutus.html">About Us</a></li>
                    <li><a href="/game/game.html">Play</a></li>
                    <li><a href="/login/login.html"><img src="/login/login.png"
                        style="width: 35px; height: 35px;"></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container-login">
            <div class="tabs">
                <div class="tab active" id="login-tab">Login</div>
                <div class="tab" id="signup-tab">Sign Up</div>
            </div>
            <div class="form-container">
                <form class="form active" id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                        <div class="error" id="login-email-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                        <div class="error" id="login-password-error"></div>
                    </div>
                    <button type="submit" id="login-button">
                        <span class="button-content">
                            Login
                            <span class="spinner" id="login-spinner"></span>
                        </span>
                    </button>
                    <div class="success-message" id="login-success"></div>
                </form>
        
                <form class="form" id="signup-form">
                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" placeholder="Enter your full name" required>
                        <div class="error" id="signup-name-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                        <div class="error" id="signup-email-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="signup-phone">Phone Number</label>
                        <input type="tel" id="signup-phone" placeholder="Enter your phone number" required>
                        <div class="error" id="signup-phone-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Create a password" required>
                        <div class="error" id="signup-password-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
                        <div class="error" id="signup-confirm-error"></div>
                    </div>
                    <button type="submit" id="signup-button">
                        <span class="button-content">
                            Sign Up
                            <span class="spinner" id="signup-spinner"></span>
                        </span>
                    </button>
                    <div class="success-message" id="signup-success"></div>
                </form>
            </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
